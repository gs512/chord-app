<div id="voicing-{{ vtype }}-{{ v.safe_id }}" class="chord-card">
    <div class="nav-row">
        <button class="btn btn-nav" {% if v.idx <= 0 %}disabled{% endif %}
                hx-get="/partial/voicing_nav?symbol={{ v.symbol | urlencode }}&vtype={{ vtype }}&idx={{ v.idx - 1 }}"
                hx-target="#voicing-{{ vtype }}-{{ v.safe_id }}" hx-swap="outerHTML">&laquo;</button>
        <span class="nav-label">{{ v.label }}</span>
        <button class="btn btn-nav" {% if v.idx >= v.total - 1 %}disabled{% endif %}
                hx-get="/partial/voicing_nav?symbol={{ v.symbol | urlencode }}&vtype={{ vtype }}&idx={{ v.idx + 1 }}"
                hx-target="#voicing-{{ vtype }}-{{ v.safe_id }}" hx-swap="outerHTML">&raquo;</button>
    </div>
    <img src="{{ v.img }}" alt="{{ v.symbol }}" style="width:100%">
    <p class="caption">{{ v.notes_str }}</p>
    {% if v.midi %}
    <div class="btn-row">
        <button class="btn btn-play" onclick="playNotes({{ v.midi }}, false)">Play</button>
    </div>
    {% endif %}
</div>
