<h2>Substitution Suggestions</h2>
{% for chord, subs in chord_subs %}
{% if subs %}
<details>
    <summary>{{ chord.symbol }}</summary>
    <div class="detail-body">
    {% for s in subs %}
        <div style="margin-bottom:8px">
            <strong>{{ s.type }}:</strong> <code>{{ s.symbol }}</code>
            <p class="text-muted">{{ s.reason }}</p>
            {% if s.gv is defined and s.gv %}
            <div class="two-col">
                <div><img src="{{ s.gv.img }}" alt="{{ s.symbol }} guitar" style="width:100%"></div>
                <div><img src="{{ s.kv.img }}" alt="{{ s.symbol }} keyboard" style="width:100%"></div>
            </div>
            {% endif %}
        </div>
        {% if not loop.last %}<div class="divider"></div>{% endif %}
    {% endfor %}
    </div>
</details>
{% endif %}
{% endfor %}
